global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: supplyguard-api
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4000"]
    # If you set METRICS_TOKEN in backend/.env, require it here:
    # authorization:
    #   credentials: "<your METRICS_TOKEN>"

  - job_name: supplyguard-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:4001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
