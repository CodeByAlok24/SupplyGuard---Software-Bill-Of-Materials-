services:
  postgres:
    image: postgres:16-alpine
    container_name: supplyguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supplyguard
      POSTGRES_PASSWORD: supplyguard
      POSTGRES_DB: supplyguard
    ports:
      - "5432:5432"
    volumes:
      - supplyguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplyguard -d supplyguard"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  supplyguard-postgres:
    name: supplyguard-postgres
